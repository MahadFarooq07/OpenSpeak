<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" width="88" height="88" role="img" aria-labelledby="title desc">
  <title id="title">OpenSpeak</title>
  <desc id="desc">A letter O traced by level-meter bars — the OpenSpeak monogram and a waveform at once.</desc>
  <defs>
    <linearGradient id="openspeakMark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9ef1"/>
      <stop offset="1" stop-color="#2174db"/>
    </linearGradient>
  </defs>
  <rect width="88" height="88" rx="19" fill="#131821"/>
  <g stroke="url(#openspeakMark)" stroke-width="6.5" stroke-linecap="round">
    <line x1="65" y1="39" x2="65" y2="49"/>
    <line x1="59" y1="25" x2="59" y2="33"/>
    <line x1="44" y1="20" x2="44" y2="28"/>
    <line x1="29" y1="25" x2="29" y2="33"/>
    <line x1="23" y1="39" x2="23" y2="49"/>
    <line x1="29" y1="55" x2="29" y2="63"/>
    <line x1="44" y1="60" x2="44" y2="68"/>
    <line x1="59" y1="55" x2="59" y2="63"/>
  </g>
</svg>
